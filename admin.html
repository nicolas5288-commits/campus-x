<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>審核後台 · UniEmbassy</title>
  <link rel="stylesheet" href="styles.css?v=48" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="index.html" class="logo"><span class="dot"></span>UniEmbassy</a>
      <nav class="nav-links">
        <a href="index.html">找計畫</a>
        <a href="submit.html">投稿</a>
      </nav>
    </div>
  </header>

  <div class="page admin-page">
    <div class="page-head">
      <h1>審核後台</h1>
      <p>審核廠商投稿的計畫，以及學長姐分享的心得。通過就會上架，退回可附原因。</p>
    </div>

    <!-- 未登入 / 非管理員時 -->
    <div id="gate" class="admin-gate" style="display:none;">
      <p style="color:var(--ink-soft);margin-bottom:18px;" id="gateMsg">請以管理員帳號登入後台。</p>
      <div id="gateForm" style="max-width:340px;margin:0 auto;text-align:left;">
        <button type="button" class="btn google-btn" id="adGoogleBtn" style="margin-bottom:16px;">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.3-2.1 14-5.6l-6.5-5.3C29.5 34.5 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.5 5.3C41.4 36.4 44 30.7 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
          用 Google 登入
        </button>
        <div class="auth-divider"><span>或用 Email</span></div>
        <div class="field"><label><span>管理員 Email</span><input type="email" id="adEmail" placeholder="you@example.com" /></label></div>
        <div class="field"><label><span>密碼</span><input type="password" id="adPw" placeholder="密碼" /></label></div>
        <div class="auth-err" id="adErr" style="margin-bottom:10px;"></div>
        <button class="btn" id="adLoginBtn" style="width:100%;justify-content:center;">登入</button>
      </div>
    </div>

    <!-- 後台主體 -->
    <div id="panel" style="display:none;">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="stats">數據總覽</button>
        <button class="admin-tab" data-tab="programs">廠商投稿 <span class="badge" id="badgeP" style="display:none;">0</span></button>
        <button class="admin-tab" data-tab="reviews">學生心得 <span class="badge" id="badgeR" style="display:none;">0</span></button>
        <button class="admin-tab" data-tab="profiles">大使名片 <span class="badge" id="badgeN" style="display:none;">0</span></button>
        <button class="admin-tab" data-tab="events">活動 <span class="badge" id="badgeE" style="display:none;">0</span></button>
        <button class="admin-tab" data-tab="notes">計畫回報 <span class="badge" id="badgeNote" style="display:none;">0</span></button>
        <button class="admin-tab" data-tab="wishes">許願池</button>
        <button class="admin-tab" data-tab="staff" id="tabStaff" style="display:none;">👥 團隊</button>
        <button class="btn ghost sm" id="adLogout" style="margin-left:auto;">登出</button>
      </div>
      <div id="queue"></div>
    </div>
  </div>
  <!-- 補完 / 編輯計畫 modal -->
  <div class="modal-mask" id="apEditMask">
    <div class="modal" id="apEditBody">
      <button class="modal-close" id="apEditClose">✕</button>
      <h2>✏️ 補完 / 編輯計畫</h2>
      <p class="auth-sub">補完學生提報的計畫，或編輯任何投稿。儲存後可直接通過上架。</p>
      <form id="apEditForm" style="margin-top:16px;">
        <div class="form-row">
          <div class="field"><label><span>品牌</span><input name="brand" required /></label></div>
          <div class="field"><label><span>Emoji</span><input name="emoji" maxlength="4" placeholder="📌" /></label></div>
        </div>
        <div class="field"><label><span>標題</span><input name="title" required /></label></div>
        <div class="form-row">
          <div class="field"><label><span>分類</span><select name="category" id="apEditCat"></select></label></div>
          <div class="field"><label><span>地區</span><input name="location" placeholder="全台 / 北部 / 遠距…" /></label></div>
        </div>
        <div class="field"><label><span>一句話簡介</span><textarea name="summary"></textarea></label></div>
        <div class="field"><span>任務內容</span><div id="apEditTasks"></div></div>
        <div class="field"><span>大使福利</span><div id="apEditBenefits"></div></div>
        <div class="field"><label><span>招募對象</span><input name="eligibility" placeholder="全台大專院校在學學生" /></label></div>
        <div class="form-row">
          <div class="field"><label><span>任期</span><input name="term" placeholder="一學期 / 專案制…" /></label></div>
          <div class="field"><label><span>截止日</span><input type="date" name="deadline" /></label></div>
        </div>
        <div class="form-row">
          <label class="check-line"><input type="checkbox" name="paid" /> 有薪 / 有獎金</label>
          <label class="check-line"><input type="checkbox" name="recruiting" checked /> 🟢 招募中</label>
        </div>
        <div class="field"><label><span>報名連結</span><input name="applyUrl" placeholder="https://..." /></label></div>
        <div class="field"><label><span>資料來源連結 <span class="hint">學生提報的原始出處</span></span><input name="sourceUrl" placeholder="https://..." /></label></div>
        <div class="field"><label><span>網址代稱 slug <span class="hint">選填，決定專屬頁網址 uniembassy.tw/p/<b>代稱</b>/。留空就用系統編號；只能用小寫英數與連字號。⚠️ 改代稱會讓已分享出去的舊連結失效</span></span><input name="slug" placeholder="例：kkbox-2026" pattern="[a-z0-9-]*" /></label></div>
        <div class="auth-err" id="apEditErr"></div>
        <div style="display:flex;gap:10px;">
          <button type="button" class="btn ghost" id="apEditSaveOnly" style="flex:1;justify-content:center;">💾 只儲存</button>
          <button type="submit" class="btn" id="apEditSave" style="flex:1;justify-content:center;">✓ 儲存並上架</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js?v=48"></script>
  <script src="data.js?v=48"></script>
  <script src="db.js?v=48"></script>
  <script>
  (function () {
    const DB = window.DB;
    let tab = "stats";
    let profileView = "pending";   // 大使名片 tab 內：pending / live / report
    let programView = "pending";   // 計畫投稿 tab 內：pending / live
    let liveProgramsCache = [];    // 已上架檢視的編輯 modal 查這裡
    let pendingProgramsCache = []; // 補完/編輯計畫 modal 用
    let apTasksList = null, apBenefitsList = null;  // RowList 實例（開 modal 時 mount）

    function toast(msg) {
      const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }
    function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
    function stars(n) { n = n || 0; return "★".repeat(n) + "☆".repeat(5 - n); }
    // 相對天數：「今天」「3 天前」——名片修改標記用
    function relDays(ts) {
      const d = Math.floor((Date.now() - new Date(ts).getTime()) / 86400000);
      if (!isFinite(d) || d < 0) return "";
      return d === 0 ? "今天" : d + " 天前";
    }

    // ---- 畫面切換 ----
    function showGate(msg) {
      document.getElementById("gate").style.display = "block";
      document.getElementById("panel").style.display = "none";
      if (msg) document.getElementById("gateMsg").textContent = msg;
    }
    function showPanel() {
      document.getElementById("gate").style.display = "none";
      document.getElementById("panel").style.display = "block";
      // 「團隊」分頁只有主理人看得到；夥伴就算手動把 tab 切過去也擋掉（DB 那層也擋，這只是體驗）
      const owner = DB.isOwner ? DB.isOwner() : true;
      document.getElementById("tabStaff").style.display = owner ? "" : "none";
      if (!owner && tab === "staff") tab = "stats";
      loadQueue();
    }

    // ---- 投稿佇列 ----
    function programCard(p) {
      return `<div class="queue-card" data-id="${p.id}">
        ${p.submittedBy ? `<span class="rev-type-badge" style="background:#fff6d9;color:#7a5a00;border:1px solid #ffe28a;">🙋 學生提報${p.submitterName ? "・" + esc(p.submitterName) : ""}</span>` : ""}
        <div style="display:flex;gap:12px;align-items:start;margin-top:${p.submittedBy ? "8px" : "0"};">
          <div class="card-emoji">${p.emoji || "📌"}</div>
          <div style="flex:1;">
            <h3>${esc(p.title)}</h3>
            <div class="q-brand">${esc(p.brand)}</div>
          </div>
        </div>
        <div class="q-meta">
          <span class="tag ${p.paid ? "paid" : "unpaid"}">${p.paid ? "有薪" : "無薪"}</span>
          <span class="tag">${esc(p.category)}</span>
          ${p.location ? `<span class="tag">${esc(p.location)}</span>` : ""}
          ${p.deadline ? `<span class="tag">截止 ${esc(p.deadline)}</span>` : ""}
        </div>
        <div class="q-section"><b>簡介</b><div>${esc(p.summary)}</div></div>
        ${p.tasks && p.tasks.length ? `<div class="q-section"><b>任務</b><div>${p.tasks.map(esc).join("、")}</div></div>` : ""}
        ${p.benefits && p.benefits.length ? `<div class="q-section"><b>福利</b><div>${p.benefits.map(esc).join("、")}</div></div>` : ""}
        ${p.sourceUrl ? `<div class="q-section"><b>來源</b><div><a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">${esc(p.sourceUrl)}</a></div></div>` : ""}
        <div class="q-section"><b>報名連結</b><div>${p.applyUrl ? `<a href="${esc(p.applyUrl)}" target="_blank" rel="noopener">${esc(p.applyUrl)}</a>` : "—"}</div></div>
        <div class="q-actions">
          <button class="btn" data-editp="${p.id}" style="background:#fff;color:var(--ink);border-color:var(--line-strong);">✏️ 補完 / 編輯</button>
          <button class="btn approve" data-approve="${p.id}">✓ 通過上架</button>
          <button class="btn reject" data-reject="${p.id}">✕ 退回</button>
          <button class="btn danger" data-delp="${p.id}">🗑️ 永久刪除</button>
        </div>
      </div>`;
    }

    // ---- 心得佇列 ----
    function reviewCard(r) {
      const typeLabel = r.type === "interview" ? "面試經驗" : "參與心得";
      const prog = r.programs ? `${esc(r.programs.title)}` : r.program_id;
      const rows = r.type === "interview"
        ? [["面試流程", r.process], ["被問了什麼", r.questions], ["準備建議", r.tips], ["結果", r.result]]
        : [["實際任務量", r.workload], ["收穫", r.gains], ["給學弟妹的建議", r.advice]];
      const body = rows.filter(([, v]) => v).map(([k, v]) =>
        `<div class="q-section"><b>${k}</b><div>${esc(v)}</div></div>`).join("");
      return `<div class="queue-card" data-id="${r.id}">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <span class="rev-type-badge">${typeLabel}</span>
          <span class="stars">${stars(r.rating)}</span>
          ${r.anonymous ? '<span class="tag">匿名</span>' : ""}
        </div>
        <div class="q-brand" style="margin-top:8px;">計畫：${prog}</div>
        ${body}
        ${r.extra ? `<div class="q-section"><b>補充</b><div>${esc(r.extra)}</div></div>` : ""}
        <div class="q-actions">
          <button class="btn approve" data-rapprove="${r.id}">✓ 通過上架</button>
          <button class="btn reject" data-rreject="${r.id}">✕ 退回</button>
          <button class="btn danger" data-delr="${r.id}">🗑️ 永久刪除</button>
        </div>
      </div>`;
    }

    async function loadQueue() {
      const queue = document.getElementById("queue");
      queue.innerHTML = '<div class="admin-empty">載入中…</div>';
      try {
        if (tab === "stats") {
          await renderStats();
        } else if (tab === "programs") {
          await renderProgramsTab();
        } else if (tab === "reviews") {
          const list = await DB.getPendingReviews();
          updateBadge("badgeR", list.length);
          queue.innerHTML = list.length
            ? list.map(reviewCard).join("")
            : '<div class="admin-empty">目前沒有待審的心得 🎉</div>';
          bindReviewActions();
        } else if (tab === "profiles") {
          await renderProfilesTab();
        } else if (tab === "wishes") {
          await renderWishes();
        } else if (tab === "staff") {
          await renderStaff();
        } else if (tab === "events") {
          const list = await DB.getPendingEvents();
          updateBadge("badgeE", list.length);
          queue.innerHTML = list.length
            ? list.map(eventCard).join("")
            : '<div class="admin-empty">目前沒有待審的活動 🎉</div>';
          bindEventActions();
        } else if (tab === "notes") {
          const list = await DB.getPendingNotes();
          pendingNotesCache = list;
          updateBadge("badgeNote", list.length);
          queue.innerHTML = list.length
            ? list.map(noteCard).join("")
            : '<div class="admin-empty">目前沒有待處理的計畫回報 🎉</div>';
          bindNoteActions();
        }
      } catch (err) {
        queue.innerHTML = `<div class="admin-empty">載入失敗：${esc(err.message)}</div>`;
      }
      refreshBadges();
    }

    function updateBadge(id, n) {
      const b = document.getElementById(id);
      b.textContent = n; b.style.display = n > 0 ? "inline-block" : "none";
    }
    async function refreshBadges() {
      try { updateBadge("badgeP", (await DB.getPendingPrograms()).length); } catch {}
      try { updateBadge("badgeR", (await DB.getPendingReviews()).length); } catch {}
      try {
        const [pp, rr] = await Promise.all([DB.getPendingProfiles(), DB.getPendingReports().catch(() => [])]);
        updateBadge("badgeN", pp.length + rr.length);
      } catch {}
      try { updateBadge("badgeE", (await DB.getPendingEvents()).length); } catch {}
      try { updateBadge("badgeNote", (await DB.getPendingNotes()).length); } catch {}
    }

    // ---- 計畫回報卡 ----
    // 值→顯示（list 用 bullet，空值講「目前沒有資料」）
    function noteValHTML(key, v) {
      const f = window.noteFieldOf(key);
      const disp = window.noteFieldDisplay(key, v);
      if (!disp) return '<span class="note-empty">目前沒有資料</span>';
      if (f && f.type === "list") return `<ul class="note-cur-list">${disp.split("\n").map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
      return esc(disp);
    }
    function noteCard(n) {
      const prog = n.programs ? `${esc(n.programs.brand)}｜${esc(n.programs.title)}` : n.program_id;
      // v14 逐格建議卡：目前 vs 建議 對照，可一鍵採用
      if (n.field && window.noteFieldOf(n.field)) {
        const f = window.noteFieldOf(n.field);
        // 「目前」取審核當下的計畫現值（不是提交當下）→ 建議過時一眼看得出
        const cur = window.noteFieldValue(n.programs, n.field);
        return `<div class="queue-card" data-id="${n.id}">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <span class="rev-type-badge">🧩 格子補充：${esc(f.label)}</span>
          </div>
          <div class="q-brand" style="margin-top:8px;">計畫：${prog}</div>
          <div class="note-diff">
            <div class="note-diff-col"><b>目前</b><div>${noteValHTML(n.field, cur)}</div></div>
            <div class="note-diff-arrow">→</div>
            <div class="note-diff-col suggest"><b>建議</b><div>${noteValHTML(n.field, n.suggest)}</div></div>
          </div>
          <div class="q-actions">
            <button class="btn" data-applynote="${n.id}" data-pid="${esc(n.program_id)}" data-nf="${esc(n.field)}" style="background:#0f8a5f;color:#fff;">✓ 採用並更新計畫</button>
            <button class="btn reject" data-notereject="${n.id}">✕ 退回</button>
            <button class="btn ghost" data-editnote="${esc(n.program_id)}">✏️ 編輯此計畫</button>
          </div>
        </div>`;
      }
      // 舊制自由文字回報，維持原樣
      return `<div class="queue-card" data-id="${n.id}">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <span class="rev-type-badge">${esc(n.type)}</span>
        </div>
        <div class="q-brand" style="margin-top:8px;">計畫：${prog}</div>
        <div class="q-section"><b>回報內容</b><div>${esc(n.content)}</div></div>
        <div class="q-actions">
          <button class="btn approve" data-editnote="${esc(n.program_id)}">✏️ 編輯此計畫</button>
          <button class="btn" data-noteok="${n.id}" style="background:#0f8a5f;color:#fff;">✓ 已處理</button>
          <button class="btn reject" data-notereject="${n.id}">✕ 退回</button>
        </div>
      </div>`;
    }
    // 待審清單原始資料（採用時要拿 suggest 值）
    let pendingNotesCache = [];
    function bindNoteActions() {
      document.querySelectorAll("[data-editnote]").forEach(b => b.onclick = () => {
        // 帶去前台該計畫的編輯（管理員登入態同一 session）
        location.href = "index.html?p=" + encodeURIComponent(b.dataset.editnote) + "&edit=1";
      });
      document.querySelectorAll("[data-noteok]").forEach(b => b.onclick = async () => {
        b.disabled = true; await DB.resolveNote(b.dataset.noteok, "accepted"); toast("已標記為處理完成 ✓"); loadQueue();
      });
      document.querySelectorAll("[data-notereject]").forEach(b => b.onclick = async () => {
        b.disabled = true; await DB.resolveNote(b.dataset.notereject, "rejected"); toast("已退回"); loadQueue();
      });
      // 逐格採用：先寫進計畫本體，再標記 accepted（+10 積分靠 accepted）
      document.querySelectorAll("[data-applynote]").forEach(b => b.onclick = async () => {
        const n = pendingNotesCache.find(x => x.id === b.dataset.applynote);
        if (!n) { toast("找不到這筆建議，請重新整理"); return; }
        b.disabled = true; b.textContent = "採用中…";
        try {
          await DB.applyNoteField(b.dataset.pid, b.dataset.nf, n.suggest);
          await DB.resolveNote(n.id, "accepted");
          toast("已採用，計畫已更新 ✓（提報人 +10 分）");
          loadQueue();
        } catch (err) {
          toast(err.message || "採用失敗");
          b.disabled = false; b.textContent = "✓ 採用並更新計畫";
        }
      });
    }

    // ---- 數據總覽 ----
    async function renderStats() {
      const queue = document.getElementById("queue");
      queue.innerHTML = '<div class="admin-empty">載入中…</div>';
      let s = {}, wishes = [];
      try { s = await DB.getAdminStats() || {}; } catch (e) { queue.innerHTML = `<div class="admin-empty">數據載入失敗：${esc(e.message)}</div>`; return; }
      try { wishes = await DB.getBrandWishes() || []; } catch {}
      const tile = (label, val, hint) => `<div class="stat-tile"><b>${val ?? "—"}</b><span>${label}</span>${hint ? `<small>${hint}</small>` : ""}</div>`;
      const wishRows = wishes.length
        ? wishes.slice(0, 15).map((w, i) => `<tr><td>${i + 1}</td><td>${esc(w.brand_name)}</td><td><b>${w.votes}</b> 票</td></tr>`).join("")
        : `<tr><td colspan="3" style="color:var(--ink-soft);text-align:center;padding:20px;">還沒有人許願</td></tr>`;
      queue.innerHTML = `
        <div class="stat-grid four">
          ${tile("註冊人數", s.users)}
          ${tile("計畫上架中", s.programs_live)}
          ${tile("收藏總數", s.favorites)}
          ${tile("大使名片", s.profiles_live)}
        </div>
        <h3 style="margin:28px 0 12px;">🪄 廠商許願排行（開發名單）</h3>
        <div class="queue-card" style="padding:0;overflow:hidden;">
          <table class="cmp-table" style="min-width:auto;">
            <tr><th style="width:48px;">#</th><th>品牌</th><th style="width:90px;">票數</th></tr>
            ${wishRows}
          </table>
        </div>`;
      refreshBadges();
    }

    // ---- 名片卡 ----
    function profileCard(p) {
      const avatarHtml = p.avatar_url

    // 上架成功 → 自動寄通知信給廠商（背景執行，結果用 toast 回報，不擋審核流程）
    async function notifyAndReport(id) {
      const r = await DB.notifyApproved(id);
      if (r.sent) toast(`📧 上架通知信已寄給 ${r.to}`);
      else if (r.skipped === "no_email") toast("這筆沒留 Email，未寄通知信（改用下面的複製訊息通知）");
      else if (r.skipped === "already_sent") toast("先前已寄過通知信，不重寄");
      else if (r.skipped === "local") { /* 本機模式安靜跳過 */ }
      else if (r.error) toast("⚠️ 通知信寄送失敗：" + r.error);
    }

    // 上架成功 → 一鍵複製「給廠商的上架通知＋專屬連結」（貼 LINE / Email 都可）
    function offerVendorNotice(id, brand, title, slug) {
      const cached = pendingProgramsCache.find((x) => x.id === id);
      if (!brand && cached) { brand = cached.brand; title = cached.title; }
      if (slug === undefined) slug = cached && cached.slug;
      const url = "https://uniembassy.tw/p/" + encodeURIComponent(slug || id) + "/";
      const label = brand ? brand + "｜" + (title || "") : "您的校園大使計畫";
      const msg = `您好，「${label}」已在 UniEmbassy 正式上架 🎉\n這是專屬頁面連結，打開就會直接看到您的招募資訊，歡迎分享到官網、社群或給有興趣的同學：\n${url}`;
      if (!confirm("要複製「給廠商的上架通知＋專屬連結」嗎？\n\n" + msg)) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(msg)
          .then(() => toast("通知訊息已複製 📋"))
          .catch(() => prompt("手動複製：", msg));
      } else {
        prompt("手動複製：", msg);
      }
    }

    (function initEditCat() {
      const sel = document.getElementById("apEditCat");
      (DB.CATEGORIES || []).forEach((c) => { const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o); });

    let editTargetId = null;
    function openEditProgram(id) {
      const p = pendingProgramsCache.find((x) => x.id === id) || liveProgramsCache.find((x) => x.id === id);
      if (!p) return;
      editTargetId = id;
      const f = document.getElementById("apEditForm");
      f.brand.value = p.brand || ""; f.emoji.value = p.emoji || ""; f.title.value = p.title || "";
      f.category.value = p.category || (DB.CATEGORIES || [])[0] || ""; f.location.value = p.location || "";
      f.summary.value = p.summary === "學生提報，資料待補完。" ? "" : (p.summary || "");
      apTasksList = window.RowList.mount(document.getElementById("apEditTasks"), { values: (p.tasks || []).slice(), placeholder: "例：經營校園社群" });
      apBenefitsList = window.RowList.mount(document.getElementById("apEditBenefits"), { values: (p.benefits || []).slice(), placeholder: "例：時薪 200 元" });
      f.eligibility.value = p.eligibility || ""; f.term.value = p.term || ""; f.deadline.value = p.deadline || "";
      f.paid.checked = !!p.paid; f.recruiting.checked = p.recruiting !== false;
      f.applyUrl.value = p.applyUrl || ""; f.sourceUrl.value = p.sourceUrl || ""; f.slug.value = p.slug || "";
      document.getElementById("apEditErr").textContent = "";
      document.getElementById("apEditMask").classList.add("open");
    }
    async function saveEditProgram(approve) {
      const f = document.getElementById("apEditForm");
      const errEl = document.getElementById("apEditErr");
      const lines = (v) => v.split("\n").map((x) => x.trim()).filter(Boolean);
      if (!f.brand.value.trim() || !f.title.value.trim()) { errEl.textContent = "品牌與標題為必填"; return; }
      const slug = f.slug.value.trim().toLowerCase();
      if (slug && !/^[a-z0-9][a-z0-9-]*$/.test(slug)) { errEl.textContent = "網址代稱只能用小寫英文、數字與連字號，且不能用連字號開頭"; return; }
      const btns = [document.getElementById("apEditSave"), document.getElementById("apEditSaveOnly")];
      btns.forEach((b) => b.disabled = true);
      errEl.textContent = "";
      try {
        const saved = await DB.updateProgram(editTargetId, {
          brand: f.brand.value.trim(), emoji: f.emoji.value.trim() || "📌", category: f.category.value,
          title: f.title.value.trim(), summary: f.summary.value.trim(),
          tasks: apTasksList.getValues(), benefits: apBenefitsList.getValues(),
          eligibility: f.eligibility.value.trim(), term: f.term.value.trim(),
          paid: f.paid.checked, location: f.location.value.trim(),
          deadline: f.deadline.value || null, recruiting: f.recruiting.checked,
          recruitNote: "", applyUrl: f.applyUrl.value.trim(), sourceUrl: f.sourceUrl.value.trim(),
          slug,
        });
        if (approve) await DB.approveProgram(editTargetId);
        document.getElementById("apEditMask").classList.remove("open");
        if (saved && saved.slugSkipped) toast("已儲存，但網址代稱沒存到 —— 請先跑 schema_v15_program_slug.sql");
        else toast(approve ? "已補完並上架 ✓" : "已儲存 ✓");
        if (approve) notifyAndReport(editTargetId);
        if (approve) offerVendorNotice(editTargetId, f.brand.value.trim(), f.title.value.trim(), saved && saved.slugSkipped ? null : slug);
        loadQueue();
      } catch (err) {
        const m = err.message || "儲存失敗";
        // slug 撞名時 Postgres 回的是 duplicate key，翻成人話
        errEl.textContent = /duplicate key|programs_slug_uniq/i.test(m)
          ? `網址代稱「${slug}」已經被其他計畫用了，請換一個`
          : m;
      }
      finally { btns.forEach((b) => b.disabled = false); }
    }
    document.getElementById("apEditClose").onclick = () => document.getElementById("apEditMask").classList.remove("open");
    document.getElementById("apEditMask").onclick = (e) => { if (e.target.id === "apEditMask") e.currentTarget.classList.remove("open"); };
    document.getElementById("apEditForm").onsubmit = (e) => { e.preventDefault(); saveEditProgram(true); };
    document.getElementById("apEditSaveOnly").onclick = () => saveEditProgram(false);
    function bindReviewActions() {
      document.querySelectorAll("[data-rapprove]").forEach(b => b.onclick = async () => {
        b.disabled = true;
        await DB.approveReview(b.dataset.rapprove);
        toast("心得已通過上架 ✓"); loadQueue();
      });
      document.querySelectorAll("[data-rreject]").forEach(b => b.onclick = async () => {
        const reason = prompt("退回原因（選填）：") ?? null;
        if (reason === null) return;
        b.disabled = true;
        await DB.rejectReview(b.dataset.rreject, reason);
        toast("已退回"); loadQueue();
      });
      document.querySelectorAll("[data-delr]").forEach(b => b.onclick = async () => {
        if (!confirm("永久刪除這則心得？\n\n此動作無法復原，資料會從資料庫徹底移除。\n若只是不想上架，請改用「退回」。")) return;
        b.disabled = true;
        try { await DB.deleteReview(b.dataset.delr); toast("已永久刪除 🗑️"); }
        catch (e) { toast("刪除失敗：" + e.message); b.disabled = false; return; }
        loadQueue();
      });
    }

    // ---- 團隊名單（只有 owner 看得到這個 tab）----
    async function renderStaff() {
      const queue = document.getElementById("queue");
      queue.innerHTML = '<div class="admin-empty">載入中…</div>';
      let list = [];
      try {
        list = await DB.getStaff();
      } catch (e) {
        queue.innerHTML = `<div class="admin-empty">載入失敗：${esc(e.message)}<br/><br/>
          若訊息提到 staff 不存在，代表 <code>supabase/schema_v18_staff_roles.sql</code> 還沒跑。</div>`;
        return;
      }
      // 用卡片列而不是表格：email 很長，表格在手機會把右邊欄位（含移除鈕）擠出畫面
      const rows = list.map((s) => {
        const owner = s.role === "owner";
        return `<div class="queue-card" style="margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <div style="flex:1;min-width:180px;">
            <div style="font-weight:600;word-break:break-all;">${esc(s.email)}</div>
            <div style="color:var(--ink-soft);font-size:12.5px;margin-top:3px;">
              ${owner ? "主理人 · 權限最高" : "審核夥伴"}${s.added_at ? " · " + esc(String(s.added_at).slice(0, 10)) + " 加入" : ""}
            </div>
          </div>
          ${owner
            ? '<span class="tag paid">主理人</span>'
            : `<span class="tag">審核夥伴</span>
               <button class="mini-del" data-delstaff="${esc(s.email)}" title="移除">🗑️ 移除</button>`}
        </div>`;
      }).join("");

      queue.innerHTML = `
        <h3 style="margin:8px 0 6px;">👥 審核團隊</h3>
        <p style="color:var(--ink-soft);font-size:13.5px;line-height:1.7;margin:0 0 14px;">
          審核夥伴可以做<b>全部的內容審核</b>（通過上架、退回、編輯、下架、永久刪除），
          但看不到這個「團隊」分頁，也<b>無法更動任何人的權限</b>——這是資料庫層擋住的，不是只把按鈕藏起來。
        </p>
        ${rows}

        <h3 style="margin:28px 0 6px;">＋ 新增審核夥伴</h3>
        <p style="color:var(--ink-soft);font-size:13.5px;line-height:1.7;margin:0 0 12px;">
          填他<b>登入這個網站用的 Google 帳號 Email</b>。建議請對方先用 Google 登入過一次網站，確認是哪個信箱再加。<br/>
          加完請他重新整理頁面，頭貼選單就會出現「🛠️ 審核後台」。移除也是即時生效。
        </p>
        <div class="queue-card">
          <div class="field"><label><span>夥伴的 Email</span>
            <input type="email" id="staffEmail" placeholder="partner@gmail.com" autocomplete="off" /></label></div>
          <div class="auth-err" id="staffErr"></div>
          <button class="btn approve" id="staffAdd">＋ 加入團隊</button>
        </div>`;

      queue.querySelectorAll("[data-delstaff]").forEach(b => b.onclick = async () => {
        const email = b.dataset.delstaff;
        if (!confirm(`移除 ${email} 的後台權限？\n\n他會立刻失去所有審核權限（已審過的內容不受影響）。`)) return;
        b.disabled = true;
        try { await DB.removeStaff(email); toast("已移除"); renderStaff(); }
        catch (e) { b.disabled = false; alert(e.message); }
      });
      const addBtn = document.getElementById("staffAdd");
      const emailInput = document.getElementById("staffEmail");
      const errBox = document.getElementById("staffErr");
      async function doAdd() {
        errBox.textContent = "";
        addBtn.disabled = true;
        try {
          const r = await DB.addStaff(emailInput.value);
          toast(`已加入 ${r.email || ""}`.trim());
          renderStaff();
        } catch (e) {
          errBox.textContent = e.message;
          addBtn.disabled = false;
        }
      }
      addBtn.onclick = doAdd;
      emailInput.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); doAdd(); } };
    }

    // ---- Tabs ----
    document.querySelectorAll(".admin-tab").forEach(t => t.onclick = () => {
      tab = t.dataset.tab;
      document.querySelectorAll(".admin-tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      loadQueue();
    });

    // ---- 登入 gate ----
    document.getElementById("adLoginBtn").onclick = async () => {
      const email = document.getElementById("adEmail").value.trim();
      const pw = document.getElementById("adPw").value;
      const err = document.getElementById("adErr");
      err.textContent = "";
      try {
        await DB.signIn(email, pw);
        // onAuth 會處理後續
      } catch (e) {
        err.textContent = /invalid login/i.test(e.message) ? "Email 或密碼錯誤" : e.message;
      }
    };
    document.getElementById("adGoogleBtn").onclick = async () => {
      try { await DB.signInWithGoogle(); }
      catch (e) { document.getElementById("adErr").textContent = e.message || "Google 登入失敗"; }
    };
    document.getElementById("adLogout").onclick = async () => { await DB.signOut(); };

    // ---- 啟動 ----
    async function boot() {
      DB.onAuth((user) => {
        if (DB.isAdmin()) {
          showPanel();
          // v18 SQL 還沒跑：仍可用（退回舊的單一管理員判斷），但團隊功能不會生效
          if (DB.needsStaffSql && DB.needsStaffSql()) {
            toast("團隊權限的資料庫設定還沒跑，目前是單人模式");
          }
        }
        else if (DB.configured) showGate(user ? "這個帳號沒有後台權限。若你是審核夥伴，請確認主理人已把這個 Email 加進團隊。" : "請以管理員帳號登入後台。");
        else showPanel(); // 本機模式直接進（方便 demo）
      });
      await DB.initAuth();
    }
    boot();
  })();
  </script>
