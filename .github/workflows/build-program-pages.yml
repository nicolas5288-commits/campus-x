name: 產生計畫獨立頁

# 計畫是在 Supabase 後台上架的，靜態站不會自己知道。
# 這支定時把 live 計畫重新渲染成 p/<slug>/index.html 並更新 sitemap，
# 有變動才 commit（push 會再觸發 Pages 重建）。
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小時
  workflow_dispatch:         # 後台上架後想立刻生效，手動按這個

permissions:
  contents: write

concurrency:
  group: build-program-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 產生獨立頁 + sitemap
        run: node tools/build-program-pages.mjs

      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p sitemap.xml
          if git diff --cached --quiet; then
            echo "沒有變動，跳過"
          else
            git commit -m "自動更新計畫獨立頁與 sitemap"
            git push
          fi
